name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          cd /root/nmt-2026
          git pull origin main
          docker compose up -d --build
          echo "Deployed successfully!"
          docker compose ps
