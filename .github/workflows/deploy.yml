name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (key auth)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          timeout: 60s
          script: |
            set -e
            cd /root/nmt-2026
            git pull origin main
            docker compose up -d --build
          script_stop: true

      - name: Deploy via SSH (password fallback)
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          timeout: 60s
          script: |
            set -e
            cd /root/nmt-2026
            git pull origin main
            docker compose up -d --build
          script_stop: true
