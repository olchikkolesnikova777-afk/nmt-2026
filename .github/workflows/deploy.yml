name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /root/nmt-2026
            git pull
            docker compose up -d --build
          script_stop: false
          timeout: 120s
